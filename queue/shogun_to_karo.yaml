  - 全PR title/body/commit message・コメントに内部用語の混入ゼロ=実測grep。main/develop 直接不可触
  command: "backlog に無い観点も含め、現状 develop の実装を能動的に点検して\n不十分点を洗い出し、タスク化して順次進めよ。Batch\
    \ Processing Protocol に則る。\n進め方の詳細(観点割当・足軽分担・batch粒度)は家老が決定。\n\n■ 進め方\n  1. まず点検フェーズ(読み取り中心)を実施し、findings\
    \ 一覧(優先度×工数×根拠)を作る。\n     戦略・観点の網羅性を軍師レビューに通してから本格化せよ。\n  2. high 優先から修正タスク化→PR。batch1\
    \ で将軍QCゲート→OKで残り自走。\n  3. cmd_675 と並行ゆえ、在flightファイルとの衝突を避けて着手範囲を調整。\n\n■ 点検観点(網羅せよ・代表例)\n\
    \  - 機能欠落/正典乖離: SDD・Figma正典に対し未実装/不整合の導線・項目。\n  - テスト不足: 重要導線(抽選/予約/認証/権限)の単体・Featureカバレッジ不足。\n\
    \  - リファクタ: 重複コード・肥大コントローラ/Fatモデル・責務分離・命名・マジックナンバー。\n  - 一貫性: バリデーション規約・例外/エラーハンドリング・レスポンス形式・i18n。\n\
    \  - セキュリティ: 認可と権限境界(hall_admin/super_admin)・入力検証・mass assignment・機微情報露出。\n  -\
    \ パフォーマンス: N+1・不足索引・重いクエリ・キャッシュ余地。\n  - 衛生: デッドコード・未使用・TODO/暫定実装・放置 migration。\n\
    \n■ マージ前提(発注者方針)\n  - 足軽は PR 作成(OPEN/レビュー可能)まで。マージは一切せず全て発注者の手に委ねる。\n  - 各PRのCI赤が自分起因か\
    \ base起因(F-RSRV/PR#215前)かを切り分けて報告。\n\n■ 品質規律\n  - main/develop 直接不可触。force push\
    \ は feature 限定 --force-with-lease(D003/D004)。\n  - PR/commit/コメントに内部用語混入ゼロ=実測grep。TVF徹底・捏造禁止・挙動変更は申告。\n"
  project: line-raffle
  priority: medium
  status: in_progress
