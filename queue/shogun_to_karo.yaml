    findings に整理し、タスク化して順次PR化する。
  acceptance_criteria:
  - backend develop 実装を下記観点で点検した結果を、優先度(high/med/low)×工数見積×根拠(ファイル:行・SDD参照)付きの findings
    一覧として report に残す
  - findings は『機能欠落/正典乖離』『テスト不足』『リファクタ(重複・肥大・責務分離・命名)』『一貫性(バリデーション/エラー/レスポンス)』『セキュリティ(認可・権限境界・入力検証・mass
    assignment)』『パフォーマンス(N+1・索引)』『デッドコード/暫定/TODO』に分類される
  - high 優先の findings から順にタスク化し、1件=1 feature ブランチ→PR を作成する(PR本文に対象 finding と根拠・変更概要を日本語明記)
